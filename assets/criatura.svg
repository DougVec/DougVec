<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030505"/><stop offset="1" stop-color="#08110c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dff6a" stop-opacity="0"/><stop offset=".5" stop-color="#7dff6a" stop-opacity=".22"/><stop offset="1" stop-color="#7dff6a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .beam{animation:sweep 7s linear infinite}
      @keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(960px)}}
      .shadow{opacity:0;animation:reveal 7s linear infinite}
      @keyframes reveal{0%,62%{opacity:0}69%{opacity:1}76%{opacity:.15}80%,100%{opacity:0}}
      .eyesA{opacity:0;animation:eyesA 7s linear infinite}
      @keyframes eyesA{0%,66%{opacity:0}69%,88%{opacity:1}89%{opacity:.1}90%{opacity:1}94%,100%{opacity:0}}
      .eyesB{opacity:0;animation:eyesB 7s linear infinite}
      @keyframes eyesB{0%,24%{opacity:0}28%,40%{opacity:.9}42%,100%{opacity:0}}
      .ten{animation:sway 2.4s ease-in-out infinite;transform-origin:0 0}
      @keyframes sway{50%{transform:rotate(9deg)}}
      .eye{fill:#7dff6a}
      .txt{font:700 30px monospace;fill:#7dff6a;letter-spacing:5px}
      .sub{font:14px monospace;fill:#4f8f47;letter-spacing:3px}
      .warn{font:12px monospace;fill:#7dff6a;letter-spacing:2px;opacity:0;animation:eyesA 7s steps(1) infinite}
    </style>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- feixe de varredura -->
  <rect class="beam" x="0" y="0" width="160" height="200" fill="url(#beam)"/>

  <text x="400" y="80" text-anchor="middle" class="txt" filter="url(#glow)">DOUGLAS VECCHI</text>
  <text x="400" y="106" text-anchor="middle" class="sub">ESPÉCIME: DESENVOLVEDOR JAVA</text>
  <text x="400" y="180" text-anchor="middle" class="warn">▲ FORMA DE VIDA NÃO IDENTIFICADA</text>

  <!-- silhueta original: massa curvada com tentáculos, revelada só quando o feixe passa -->
  <g transform="translate(630 200)">
    <g class="shadow">
      <g transform="translate(-34 -40)"><path class="ten" d="M0 0 q-14 16 -6 32 q4 8 -4 10" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/></g>
      <g transform="translate(30 -38)"><path class="ten" style="animation-delay:-1.2s" d="M0 0 q16 14 8 30 q-4 8 6 10" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/></g>
      <path d="M-62 0 q-6 -46 14 -78 q12 -22 30 -30 q10 -18 26 -16 q18 2 24 18 q22 10 30 34 q16 34 8 72z" fill="#000" stroke="#1f4a2a" stroke-width="1.5"/>
      <path d="M-30 -96 q-6 -12 2 -20 M0 -126 q2 -12 10 -14 M26 -104 q8 -8 16 -4" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g class="eyesA" filter="url(#glow)">
      <ellipse class="eye" cx="-14" cy="-92" rx="4" ry="2.4"/><ellipse class="eye" cx="10" cy="-94" rx="4" ry="2.4"/>
      <ellipse class="eye" cx="-4" cy="-80" rx="2.6" ry="1.6"/><ellipse class="eye" cx="22" cy="-82" rx="2.2" ry="1.4"/>
    </g>
  </g>

  <!-- outro par de olhos no escuro, sem corpo -->
  <g class="eyesB" filter="url(#glow)" transform="translate(140 150)">
    <ellipse class="eye" cx="0" cy="0" rx="3" ry="1.8"/><ellipse class="eye" cx="16" cy="1" rx="3" ry="1.8"/>
  </g>
</svg>
